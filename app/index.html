<title>Traffic Light Efficiency Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky header with section tabs; Simulation is a two-column workbench (settings | results) that stacks on phones. */
:root {
  --bg: #eef0f2;
  --surface: #fbfbfc;
  --surface-2: #e4e7eb;
  --ink: #15181d;
  --ink-2: #4a505a;
  --muted: #7d838d;
  --line: #d6dae0;
  --accent: #a35f00;          /* signal amber: interactive and selected states */
  --accent-ink: #ffffff;
  --accent-wash: #f6e7cf;
  --series-a: #2a78d6;        /* two-way */
  --series-b: #eb6834;        /* four-way */
  --good: #0a7f2e;
  --bad: #c23535;
  --div-mid: #f0efec;
  --road: #4b5058;
  --road-edge: #6b7079;
  --verge: #dfe3e7;
  --marking: #f4f5f6;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #1b1e22; --surface-2: #262a30; --ink: #eef0f2; --ink-2: #b9bec6; --muted: #858b95;
    --line: #2f343b; --accent: #f0a830; --accent-ink: #1b1300; --accent-wash: #3a2c12;
    --series-a: #3987e5; --series-b: #d95926; --good: #3cc46a; --bad: #ef6b6b; --div-mid: #383835;
    --road: #2e3237; --road-edge: #444a52; --verge: #1f2327; --marking: #a9afb7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1b1e22; --surface-2: #262a30; --ink: #eef0f2; --ink-2: #b9bec6; --muted: #858b95;
  --line: #2f343b; --accent: #f0a830; --accent-ink: #1b1300; --accent-wash: #3a2c12;
  --series-a: #3987e5; --series-b: #d95926; --good: #3cc46a; --bad: #ef6b6b; --div-mid: #383835;
  --road: #2e3237; --road-edge: #444a52; --verge: #1f2327; --marking: #a9afb7;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
h1 { font-size: 26px; line-height: 1.1; }
h2 { font-size: 21px; }
h3 { font-size: 16px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1320px; margin: 0 auto; padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 6px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand .lights { display: inline-flex; gap: 3px; align-self: center; }
.brand .lights i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.brand small { color: var(--ink-2); font-size: 13px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer; font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--ink-2); white-space: nowrap; letter-spacing: 0.02em; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }

main { max-width: 1320px; margin: 0 auto; padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.lede { color: var(--ink-2); max-width: 68ch; }
.note { color: var(--muted); font-size: 13px; }
.uk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); background: var(--surface-2); padding: 3px 9px; border-radius: 99px; }

.sim-grid { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
.sim-side { display: grid; gap: 14px; position: sticky; top: 104px; max-height: calc(100vh - 116px); overflow-y: auto; padding-right: 2px; }
.sim-main { display: grid; gap: 18px; min-width: 0; }
@media (max-width: 900px) { .sim-grid { grid-template-columns: minmax(0, 1fr); } .sim-side { position: static; max-height: none; overflow: visible; } }

.field { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.field label { font-size: 14px; color: var(--ink-2); }
.field .val { display: flex; align-items: center; gap: 4px; }
.field input[type=number] { width: 70px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); text-align: right; font-variant-numeric: tabular-nums; }
.field .unit { font-size: 12px; color: var(--muted); min-width: 30px; }
.field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
.field select { padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.group { display: grid; gap: 10px; }
.group + .group { border-top: 1px solid var(--line); padding-top: 12px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--accent); }
.approach-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.approach-grid .ap { border: 1px solid var(--line); border-radius: 5px; padding: 8px; display: grid; gap: 6px; }
.approach-grid .ap h4 { margin: 0; font-family: var(--font-display); font-size: 15px; }
.approach-grid .field input[type=number] { width: 56px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 5px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 5px 10px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }

.headline { display: grid; gap: 10px; border-left: 4px solid var(--verdict, var(--muted)); }
.headline .statement { font-size: 19px; line-height: 1.35; max-width: 70ch; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: block; }
.chip.bad { color: var(--bad); }
.chip.good { color: var(--good); }
.progress { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); transition: width 0.2s; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
thead th { font-weight: 600; color: var(--ink-2); font-size: 13px; }
td .range { color: var(--muted); font-size: 12px; display: block; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.better { color: var(--good); font-weight: 600; }
.worse { color: var(--bad); font-weight: 600; }

.anim-wrap { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 12px; }
.anim-wrap figure { margin: 0; display: grid; gap: 6px; }
.anim-wrap figcaption { display: flex; justify-content: space-between; font-size: 14px; gap: 8px; flex-wrap: wrap; }
.anim-wrap canvas { width: 100%; aspect-ratio: 1; border-radius: 5px; display: block; background: var(--verge); }
@media (max-width: 560px) { .anim-wrap { grid-template-columns: minmax(0, 1fr); } }
.anim-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.anim-controls input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 18px; }
.chart { position: relative; min-width: 0; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--ink-2); stroke-width: 1; opacity: 0.5; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); white-space: nowrap; z-index: 3; }
.tip b { font-weight: 600; }

.cap-grid { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 800px) { .cap-grid { grid-template-columns: minmax(0, 1fr); } }
.big-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.big { display: grid; gap: 2px; }
.big .label { font-size: 13px; color: var(--ink-2); }
.big .value { font-family: var(--font-display); font-size: 34px; font-weight: 600; line-height: 1; }
.big .sub { font-size: 13px; color: var(--muted); }

.heat-wrap { overflow-x: auto; }
.heat-legend { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.heat-legend .bar { width: 180px; height: 10px; border-radius: 2px; }

textarea.io { width: 100%; min-height: 140px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); resize: vertical; }
.method { display: grid; gap: 14px; max-width: 78ch; }
.method dl { display: grid; gap: 10px; margin: 0; }
.method dt { font-weight: 600; }
.method dd { margin: 0; color: var(--ink-2); }
.err { color: var(--bad); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="lights" aria-hidden="true"><i style="background:#e34948"></i><i style="background:#f2a900"></i><i style="background:#19b35c"></i></span>
      <h1>Traffic Light Efficiency Model</h1>
      <small>Two-way against four-way signalling at a four-arm junction</small>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main id="root"><p class="note">Loading the model…</p></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script type="module" src="./app.js"></script>
